[meta]
format = 1
title = Complete format-1 example
description = This manifest demonstrates every field type.

[group.scalars]
label = Scalar values

[field.enabled]
group = scalars
path = translator/enable_completion
type = boolean
label = Enable completion
default = true

[field.page_size]
group = scalars
path = menu/page_size
type = integer
label = Candidates per page
min = 1
max = 10

[field.quality]
group = scalars
path = translator/quality
type = number
label = Quality
min = 0
max = 1.0
default = 0.5

[field.comment_format]
group = scalars
path = menu/comment_format
type = string
label = Comment format
default =

[field.icon]
group = scalars
path = schema/icon
type = file
label = Schema icon
default =
extensions = ico|png

[field.shift_action]
group = scalars
path = ascii_composer/switch_key/Shift_L
type = enum
label = Left Shift
options = noop|inline_ascii|commit_text|commit_code|clear
default = inline_ascii

[group.lists]
label = Lists

[field.labels]
group = lists
path = menu/alternative_select_labels
type = list
label = Candidate labels
rows = 5
default =

[field.bindings]
group = lists
path = key_binder/bindings
type = key_binding_list
label = Key bindings
rows = 5

[field.switches]
group = lists
path = switches
type = switch_list
label = Schema options

[field.engines]
group = lists
path = engine
type = engine_lists
label = Engine components
rows = 8

[group.maps]
label = Maps

[field.punctuation]
group = maps
path = punctuator/half_shape
type = punctuator_map
label = Half-shape punctuation

[field.patterns]
group = maps
path = recognizer/patterns
type = recognizer_patterns
label = Recognizer patterns
